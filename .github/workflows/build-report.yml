# Generated by ChatGPT

name: Build Report PDF

on:
  push:

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra

      - name: Create build directory
        run: mkdir -p report/build

      - name: Convert Markdown to PDF
        run: |
          pandoc report/report.md \
            -o report/build/BSc_group_e.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: BSc_group_e
          path: report/build/BSc_group_e.pdf