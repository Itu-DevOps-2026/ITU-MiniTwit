name: Build Report PDF

on:
  push:
    paths:
      - 'report/report.md'
  workflow_dispatch:
    manual: true

jobs:
  build-report:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-latex-base \
            texlive-fonts-recommended \
            texlive-latex-extra

      - name: Generate PDF
        run: |
          pandoc report/report.md \
            --from markdown \
            --toc \
            --number-sections \
            --citeproc \
            --bibliography=report/references.bib \
            -V geometry:margin=1in \
            -o report/BSc_group_e.pdf

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add report/BSc_group_e.pdf

          git diff --cached --quiet || git commit -m "Auto-update report PDF [skip ci]"

          git push